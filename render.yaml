# Render Blueprint for the hosted Daebot agent (https://daebot.live).
# Only the agent/ directory is deployed.
services:
  - type: web
    name: daebot
    runtime: node
    plan: starter
    rootDir: agent
    # The agent has no runtime dependencies, so this is effectively a no-op; it keeps the build step explicit.
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node src/cli.ts serve --hosted
    healthCheckPath: /health
    autoDeploy: false
    # Persistent disk for saved chats (DATA_DIR). A disk pins the service to one instance and
    # makes deploys restart in place instead of zero-downtime; that matches the single-process design.
    disk:
      name: daebot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      # ---- secrets: set these in the Render dashboard (sync: false = never stored in this file)
      - key: MIND_API_KEY
        sync: false
      - key: MIND_SESSION_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GATEWAY_TOKEN        # the login access code, at least 24 characters
        sync: false
      - key: DAEBOT_SECRET_KEY    # AES-256-GCM key for stored user credentials, 32+ random characters. Enables Sign in with MIND.
        sync: false
      # ---- models: set a cheap one (do not leave the built-in default on a public bot)
      - key: MINDCLAW_MODEL
        sync: false
      - key: MINDCLAW_CHEAP_MODEL
        sync: false
      # ---- plain values
      - key: NODE_VERSION
        value: "24"
      - key: MINDCLAW_HOSTED
        value: "1"
      - key: MINDCLAW_KERNEL
        value: "1"
      - key: MINDCLAW_DAILY_USD_CAP
        value: "5"
      - key: ALLOWED_HOSTS        # RENDER_EXTERNAL_HOSTNAME (<service>.onrender.com) is added automatically
        value: "daebot.live,www.daebot.live"
      - key: DAEBOT_ADMINS        # MIND usernames that get the unrestricted tier; everyone else is staff
        value: "anthonyjconti"
      - key: MINDCLAW_USER_DAILY_USD_CAP   # per signed-in user per UTC day (admins exempt); the global cap above still applies
        value: "1"
