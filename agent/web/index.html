<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daebot</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0c0b0a">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/brand/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="/brand/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/brand/brand.css">
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 20 20"><path d="M3.5 6h13M3.5 10h13M3.5 14h13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 2.8l6 2.2v4.6c0 3.6-2.5 6.2-6 7.6-3.5-1.4-6-4-6-7.6V5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 20 20"><path d="M16.5 11.8A6.8 6.8 0 018.2 3.5a6.8 6.8 0 108.3 8.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 20 20"><path d="M10 16V4.5M5 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5.5" y="5.5" width="9" height="9" rx="1.8" fill="currentColor"/></symbol>
  <symbol id="i-chev" viewBox="0 0 20 20"><path d="M7.5 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13 7V5.5A1.5 1.5 0 0011.5 4h-6A1.5 1.5 0 004 5.5v6A1.5 1.5 0 005.5 13H7" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Sessions">
    <div class="brand">
      <m-bot class="brand-bot" playful></m-bot>
      <span class="brand-name">Daebot</span>
    </div>
    <button class="btn-new" id="btn-new" type="button"><svg class="ic"><use href="#i-plus"/></svg><span>New session</span></button>
    <div class="side-label">Sessions</div>
    <nav class="session-list" id="session-list"></nav>
    <div class="side-who" id="who" hidden></div>
    <div class="side-plan" id="plan" hidden><span class="plan-text" id="plan-text"></span><a class="plan-link" id="plan-link" href="#" target="_blank" rel="noopener noreferrer">Manage plan</a></div>
    <div class="side-foot"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting</span><button class="btn-quiet logout" id="btn-logout" type="button" hidden>Sign out</button></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" type="button" aria-label="Open sessions"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="top-title">
        <h1 id="title">New session</h1>
        <p id="subtitle">Not started</p>
      </div>
      <span class="model-badge" id="model-badge" hidden><i class="mb-led" aria-hidden="true"></i><span class="mb-name" id="mb-name"></span><span class="mb-via" id="mb-via"></span></span>
      <div class="top-meta" id="usage" title="Tokens in / out and cost this session" hidden>
        <span id="usage-tokens"></span><span class="sep">·</span><span id="usage-cost"></span>
      </div>
      <button class="icon-btn" id="btn-violations" type="button" aria-label="Kernel violations" aria-expanded="false"><svg class="ic"><use href="#i-shield"/></svg><span class="badge" id="viol-count" hidden>0</span></button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="Toggle theme"><svg class="ic" id="theme-ic"><use href="#i-moon"/></svg></button>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message Daebot" aria-label="Message"></textarea>
        <button class="send" id="btn-send" type="submit" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
        <button class="send stop" id="btn-stop" type="button" aria-label="Stop (Esc)" hidden><svg class="ic"><use href="#i-stop"/></svg></button>
      </form>
      <p class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line · <kbd>Esc</kbd> to stop</p>
    </div>
  </main>

  <aside class="drawer" id="drawer" aria-label="Kernel violations" hidden>
    <div class="drawer-head">
      <h2>Violations</h2>
      <button class="icon-btn" id="btn-drawer-close" type="button" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <p class="drawer-note" id="drawer-note"></p>
    <ol class="viol-list" id="viol-list"></ol>
  </aside>
</div>

<div class="gate-token" id="token-gate" hidden>
  <form class="token-card" id="token-form">
    <h2>Gateway token</h2>
    <p>Paste the token from <code>~/.mindclaw/gateway-token</code>. It stays in this tab only.</p>
    <input id="token-input" type="password" autocomplete="off" spellcheck="false" aria-label="Gateway token">
    <button class="btn-primary" type="submit">Connect</button>
    <p class="err" id="token-err" hidden></p>
  </form>
</div>

<script type="module" src="/app.js"></script>
<script type="module" src="/brand/brand.js"></script>
</body>
</html>
